spring:
  application:
    name: service-file

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

aws:
  s3:
    region: ap-northeast-2
    bucket: ${BUCKET_NAME}

tikitaka:
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: service-file
      auto-offset-reset: earliest
      trusted-packages: tikitaka.*

server:
  port: 8083