spring:
  application:
    name: service-performance
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

tikitaka:
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: service-performance
      auto-offset-reset: earliest
      trusted-packages: tikitaka.*

server:
  port: 8081