name: blockticket-term-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: blockticket_term
      MYSQL_USER: ${DB_USERNAME:?Create service-term/.env from .env.example}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Create service-term/.env from .env.example}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
