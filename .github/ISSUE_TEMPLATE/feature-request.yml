name: 기능 추가
description: 새로운 기능을 제안합니다.
title: "[Feature] "
labels:
  - feature

body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      placeholder: 해당 기능이 필요한 이유를 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      placeholder: |
        - [ ] API 추가
        - [ ] Service 구현
        - [ ] 테스트 작성
    validations:
      required: true